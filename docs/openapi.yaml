openapi: 3.0.3
info:
  title: Hospital Management System API
  description: API documentation for managing Patients, Doctors, and Appointments.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Spring Cloud Gateway / Local Server

paths:
  /patients:
    get:
      summary: Get all patients
      description: Returns a list of all registered patients in the hospital system.
      responses:
        '200':
          description: Successfully fetched patients list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
    
    post:
      summary: Add a new patient
      description: Registers a new patient in the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInput'
      responses:
        '201':
          description: Patient successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'

  /patients/{id}:
    get:
      summary: Get a patient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "64f1a2b3c4d5e6f7a8b9c0d1"
      responses:
        '200':
          description: Patient details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '404':
          description: Patient not found

  /doctors:
    get:
      summary: Get all doctors
      responses:
        '200':
          description: List of available doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doctor'

components:
  schemas:
    PatientInput:
      type: object
      required:
        - name
        - age
        - gender
      properties:
        name:
          type: string
          example: "Saman Perera"
        age:
          type: integer
          example: 34
        gender:
          type: string
          example: "Male"
        contactNumber:
          type: string
          example: "0771234567"

    Patient:
      type: object
      properties:
        id:
          type: string
          example: "64f1a2b3c4d5e6f7a8b9c0d1"
        name:
          type: string
          example: "Saman Perera"
        age:
          type: integer
          example: 34
        gender:
          type: string
          example: "Male"
        contactNumber:
          type: string
          example: "0771234567"

    Doctor:
      type: object
      properties:
        id:
          type: string
          example: "doc-101"
        name:
          type: string
          example: "Dr. Nimal Silva"
        specialization:
          type: string
          example: "Cardiologist"